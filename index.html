<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Стартовая</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="changeFolderBtn" class="corner-btn" title="Выбрать папку с фонами">📁</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*" style="display: none;">

    <div id="backgroundBlock" class="background-block"></div>

    <div class="bookmarks-block">
        <div class="container" id="bookmarksContainer">
            <!-- закладки будут вставлены скриптом -->
        </div>
    </div>

    <script>
        (function() {
            // --- IndexedDB для фонов ---
            const DB_NAME = 'BackgroundImagesDB';
            const STORE_NAME = 'images';
            const DB_VERSION = 1;
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    request.onsuccess = (event) => {
                        db = event.target.result;
                        resolve(db);
                    };
                    request.onerror = (event) => reject(event.target.error);
                });
            }

            function saveImage(blob) {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const item = { blob: blob, timestamp: Date.now() };
                    const request = store.add(item);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            function getAllImages() {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function setRandomBackground(images, element) {
                const oldUrl = element.dataset.bgUrl;
                if (oldUrl) URL.revokeObjectURL(oldUrl);
                if (!images || images.length === 0) {
                    element.style.backgroundImage = '';
                    element.dataset.bgUrl = '';
                    return;
                }
                const randomIndex = Math.floor(Math.random() * images.length);
                const blob = images[randomIndex].blob;
                const url = URL.createObjectURL(blob);
                element.style.backgroundImage = `url(${url})`;
                element.dataset.bgUrl = url;
            }

            async function replaceImagesFromFolder(files) {
                const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
                if (imageFiles.length === 0) {
                    alert('В выбранной папке нет изображений');
                    return;
                }
                try {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    await new Promise((resolve, reject) => {
                        const clearRequest = store.clear();
                        clearRequest.onsuccess = resolve;
                        clearRequest.onerror = reject;
                    });
                    await Promise.all(imageFiles.map(file => saveImage(file)));
                    const images = await getAllImages();
                    setRandomBackground(images, document.getElementById('backgroundBlock'));
                } catch (err) {
                    console.error('Ошибка при замене изображений:', err);
                    alert('Не удалось обновить фоны');
                }
            }

            // --- Загрузка закладок из bookmarks.json ---
            async function loadBookmarks() {
                const container = document.getElementById('bookmarksContainer');
                try {
                    const response = await fetch('bookmarks.json');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const groups = await response.json();

                    container.innerHTML = '';

                    groups.forEach(group => {
                        const section = document.createElement('section');
                        section.className = 'bookmark-group';

                        const ul = document.createElement('ul');
                        ul.className = 'bookmark-list';

                        group.links.forEach(link => {
                            const li = document.createElement('li');
                            li.className = 'bookmark-item';

                            const a = document.createElement('a');
                            a.href = link.url;
                            a.className = 'bookmark-link';
                            a.target = '_blank';
                            a.rel = 'noopener';

                            const iconSpan = document.createElement('span');
                            iconSpan.className = 'bookmark-icon';
                            iconSpan.textContent = link.icon || '🔗';

                            const nameSpan = document.createElement('span');
                            nameSpan.className = 'bookmark-name';
                            nameSpan.textContent = link.name;

                            a.appendChild(iconSpan);
                            a.appendChild(nameSpan);
                            li.appendChild(a);
                            ul.appendChild(li);
                        });

                        section.appendChild(ul);
                        container.appendChild(section);
                    });
                } catch (err) {
                    console.error('Ошибка загрузки закладок:', err);
                    container.innerHTML = '<p style="color:#a0a0a0; padding:20px;">Не удалось загрузить закладки</p>';
                }
            }

            async function init() {
                try {
                    await openDB();
                    const images = await getAllImages();
                    setRandomBackground(images, document.getElementById('backgroundBlock'));
                } catch (err) {
                    console.error('Ошибка инициализации БД:', err);
                }

                await loadBookmarks();

                const folderInput = document.getElementById('folderInput');
                const changeBtn = document.getElementById('changeFolderBtn');
                changeBtn.addEventListener('click', () => {
                    folderInput.value = '';
                    folderInput.click();
                });
                folderInput.addEventListener('change', (event) => {
                    if (event.target.files.length > 0) {
                        replaceImagesFromFolder(event.target.files);
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
