<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Стартовая</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #121212;
            --surface: rgba(30, 30, 30, 0.85);
            --surface-hover: rgba(42, 42, 42, 0.8);
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #6eb5ff;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --transition: 0.2s ease;
            --tap-min-height: 44px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
        }

        .background-block {
            flex: 3;
            border-radius: var(--radius);
            background-color: var(--surface);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.4s ease;
            position: relative;
            z-index: 0;
            overflow: hidden;
        }

        .bookmarks-block {
            flex: 1;
            border-radius: var(--radius);
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            align-items: stretch;
            position: relative;
            z-index: 1;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            padding: 12px 16px;
            width: 100%;
        }

        .bookmark-group {
            background: transparent;
            border-radius: var(--radius);
            overflow: hidden;
            flex: 1 1 0;
            min-width: 0;
            max-width: 220px;
        }

        .bookmark-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .bookmark-item {
            border-top: 1px solid var(--border);
        }

        .bookmark-link {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 450;
            min-height: var(--tap-min-height);
            transition: background var(--transition);
            gap: 8px;
            -webkit-user-select: none;
            user-select: none;
        }

        .bookmark-link:active {
            background: var(--surface-hover);
            outline: none;
        }

        @media (hover: hover) {
            .bookmark-link:hover {
                background: var(--surface-hover);
            }
        }

        .bookmark-icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .bookmark-name {
            font-size: 0.95rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .corner-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .corner-btn:active {
            background: rgba(50, 50, 50, 0.8);
            transform: scale(0.95);
        }

        @media (max-width: 360px) {
            .bookmark-link {
                padding: 8px 12px;
            }
            .bookmark-name {
                font-size: 0.85rem;
            }
            .corner-btn {
                top: 16px;
                left: 16px;
            }
        }
    </style>
</head>
<body>
    <button id="changeFolderBtn" class="corner-btn" title="Выбрать папку с фонами">📁</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*" style="display: none;">

    <div id="backgroundBlock" class="background-block"></div>

    <div class="bookmarks-block">
        <div class="container" id="bookmarksContainer">
            <!-- закладки будут вставлены скриптом -->
        </div>
    </div>

    <script>
        (function() {
            // --- IndexedDB для фонов ---
            const DB_NAME = 'BackgroundImagesDB';
            const STORE_NAME = 'images';
            const DB_VERSION = 1;
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    request.onsuccess = (event) => {
                        db = event.target.result;
                        resolve(db);
                    };
                    request.onerror = (event) => reject(event.target.error);
                });
            }

            function saveImage(blob) {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const item = { blob: blob, timestamp: Date.now() };
                    const request = store.add(item);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }

            function getAllImages() {
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function setRandomBackground(images, element) {
                const oldUrl = element.dataset.bgUrl;
                if (oldUrl) URL.revokeObjectURL(oldUrl);
                if (!images || images.length === 0) {
                    element.style.backgroundImage = '';
                    element.dataset.bgUrl = '';
                    return;
                }
                const randomIndex = Math.floor(Math.random() * images.length);
                const blob = images[randomIndex].blob;
                const url = URL.createObjectURL(blob);
                element.style.backgroundImage = `url(${url})`;
                element.dataset.bgUrl = url;
            }

            async function replaceImagesFromFolder(files) {
                const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
                if (imageFiles.length === 0) {
                    alert('В выбранной папке нет изображений');
                    return;
                }
                try {
                    const transaction = db.transaction(STORE_NAME, 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    await new Promise((resolve, reject) => {
                        const clearRequest = store.clear();
                        clearRequest.onsuccess = resolve;
                        clearRequest.onerror = reject;
                    });
                    await Promise.all(imageFiles.map(file => saveImage(file)));
                    const images = await getAllImages();
                    setRandomBackground(images, document.getElementById('backgroundBlock'));
                } catch (err) {
                    console.error('Ошибка при замене изображений:', err);
                    alert('Не удалось обновить фоны');
                }
            }

            // --- Загрузка закладок из bookmarks.json ---
            async function loadBookmarks() {
                const container = document.getElementById('bookmarksContainer');
                try {
                    const response = await fetch('bookmarks.json');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const groups = await response.json();

                    container.innerHTML = '';

                    groups.forEach(group => {
                        const section = document.createElement('section');
                        section.className = 'bookmark-group';

                        const ul = document.createElement('ul');
                        ul.className = 'bookmark-list';

                        group.links.forEach(link => {
                            const li = document.createElement('li');
                            li.className = 'bookmark-item';

                            const a = document.createElement('a');
                            a.href = link.url;
                            a.className = 'bookmark-link';
                            a.target = '_blank';
                            a.rel = 'noopener';

                            const iconSpan = document.createElement('span');
                            iconSpan.className = 'bookmark-icon';
                            iconSpan.textContent = link.icon || '🔗';

                            const nameSpan = document.createElement('span');
                            nameSpan.className = 'bookmark-name';
                            nameSpan.textContent = link.name;

                            a.appendChild(iconSpan);
                            a.appendChild(nameSpan);
                            li.appendChild(a);
                            ul.appendChild(li);
                        });

                        section.appendChild(ul);
                        container.appendChild(section);
                    });
                } catch (err) {
                    console.error('Ошибка загрузки закладок:', err);
                    container.innerHTML = '<p style="color:#a0a0a0; padding:20px;">Не удалось загрузить закладки</p>';
                }
            }

            async function init() {
                try {
                    await openDB();
                    const images = await getAllImages();
                    setRandomBackground(images, document.getElementById('backgroundBlock'));
                } catch (err) {
                    console.error('Ошибка инициализации БД:', err);
                }

                await loadBookmarks();

                const folderInput = document.getElementById('folderInput');
                const changeBtn = document.getElementById('changeFolderBtn');
                changeBtn.addEventListener('click', () => {
                    folderInput.value = '';
                    folderInput.click();
                });
                folderInput.addEventListener('change', (event) => {
                    if (event.target.files.length > 0) {
                        replaceImagesFromFolder(event.target.files);
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
